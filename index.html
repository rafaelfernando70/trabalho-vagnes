<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gangorra com Hexágono</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .centro {
            position: relative;
            width: 600px;
            height: 400px;
        }
        
        .gangorra {
            position: absolute;
            bottom: 58px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px; /* Plataforma maior */
            height: 4px;
            background: white;
            border-radius: 2px;
            transform-origin: center center;
            z-index: 5;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .hexagono-container {
            position: absolute;
            top: -50px; /* Muito acima da plataforma */
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 46px;
            z-index: 10;
        }
        
        .hexagono {
            width: 40px;
            height: 46px;
            background: white;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            /* Garante que o hexágono nunca entre na plataforma */
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="centro">
        <div class="gangorra" id="gangorra">
            <div class="hexagono-container" id="hexagonoContainer">
                <div class="hexagono" id="hexagono"></div>
            </div>
        </div>
    </div>

    <script>
        const gangorra = document.getElementById('gangorra');
        const hexagonoContainer = document.getElementById('hexagonoContainer');
        const hexagono = document.getElementById('hexagono');
        
        // Física do hexágono
        let posicaoX = 0;
        let velocidadeX = 200;
        let ultimaAtualizacao = performance.now();
        let rotacaoAtual = 0;
        let direcaoGiro = 1;
        
        const larguraPlataforma = 500; // Atualizado para combinar com o CSS
        const metadeHexagono = 20;
        const limiteMovimento = (larguraPlataforma / 2) - metadeHexagono;
        const amplitude = 25;
        
        function atualizarFisica(agora) {
            const deltaTempo = Math.min((agora - ultimaAtualizacao) / 1000, 0.05);
            ultimaAtualizacao = agora;
            
            // Atualiza posição horizontal
            posicaoX += velocidadeX * deltaTempo;
            
            // Colisão simples com as bordas
            if (posicaoX >= limiteMovimento) {
                posicaoX = limiteMovimento;
                velocidadeX = -Math.abs(velocidadeX);
                direcaoGiro = -1;
            } else if (posicaoX <= -limiteMovimento) {
                posicaoX = -limiteMovimento;
                velocidadeX = Math.abs(velocidadeX);
                direcaoGiro = 1;
            }
            
            // Atualiza rotação
            const velocidadeRotacao = Math.abs(velocidadeX) * 2;
            rotacaoAtual += velocidadeRotacao * direcaoGiro * deltaTempo;
            hexagono.style.transform = `rotate(${rotacaoAtual}deg)`;
            
            // Ângulo da gangorra
            const angulo = -(posicaoX / limiteMovimento) * amplitude;
            gangorra.style.transform = `translateX(-50%) rotate(${angulo}deg)`;
            
            // Posiciona o hexágono
            hexagonoContainer.style.left = `calc(50% + ${posicaoX}px)`;
            
            // Mantém o hexágono SEMPRE acima da plataforma
            // A altura base é -50px para garantir que mesmo com rotação não toque na plataforma
            const alturaBase = -50;
            const ajusteInclinacao = Math.abs(posicaoX) * 0.03;
            hexagonoContainer.style.top = `${alturaBase - ajusteInclinacao}px`;
            
            requestAnimationFrame(atualizarFisica);
        }
        
        // Inicia a simulação
        requestAnimationFrame(atualizarFisica);
    </script>
</body>
</html>
